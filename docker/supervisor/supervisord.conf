[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
user=root

; ─── Nginx ───────────────────────────────────────────────────────────────────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── PHP-FPM ─────────────────────────────────────────────────────────────────
[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ─── Queue Worker ─────────────────────────────────────────────────────────────
[program:queue-worker]
command=php /var/www/html/artisan queue:work %(ENV_QUEUE_CONNECTION)s --sleep=3 --tries=3 --max-time=3600 --memory=128
directory=/var/www/html
autostart=true
autorestart=true
numprocs=2
process_name=%(program_name)s_%(process_num)02d
priority=20
stdout_logfile=/var/log/supervisor/queue-worker.log
stderr_logfile=/var/log/supervisor/queue-worker-error.log

; ─── Scheduler ───────────────────────────────────────────────────────────────
[program:scheduler]
command=sh -c "while true; do php /var/www/html/artisan schedule:run --no-interaction >> /var/log/supervisor/scheduler.log 2>&1; sleep 60; done"
directory=/var/www/html
autostart=true
autorestart=true
priority=30
stdout_logfile=/var/log/supervisor/scheduler.log
stderr_logfile=/var/log/supervisor/scheduler-error.log

; ─── Reverb WebSocket Server ─────────────────────────────────────────────────
; Binds to a fixed internal port (8080), NOT %(ENV_REVERB_PORT)s -- REVERB_PORT
; is the PUBLIC port browsers connect to (e.g. 443 in production, proxied by
; the nginx block above down to this process), not what this process itself
; should bind to. Interpolating an unset/wrong env var here silently produced
; "--port=" (empty) or bound to 443 instead of matching nginx's proxy target
; below. 8080 matches docker-compose.yml's reverb service and nginx's
; proxy_pass. See docs/DOT_REALTIME_STANDARD.md (Dot.Mines) for the full
; internal-vs-public Reverb addressing rationale.
[program:reverb]
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080 --no-interaction
directory=/var/www/html
autostart=true
autorestart=true
priority=15
stdout_logfile=/var/log/supervisor/reverb.log
stderr_logfile=/var/log/supervisor/reverb-error.log
