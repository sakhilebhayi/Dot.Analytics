server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # PHP-FPM
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass            127.0.0.1:9000;
        fastcgi_index           index.php;
        fastcgi_param           SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include                 fastcgi_params;
        fastcgi_read_timeout    60;
        fastcgi_buffers         16 16k;
        fastcgi_buffer_size     32k;
    }

    # Deny hidden files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Health check endpoints — bypass auth
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    location = /up/realtime {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    # WebSocket Reverse Proxy — only Reverb's client-facing path
    # (/app/{key}, what Echo/pusher-js connects to) is proxied; its
    # server-to-server publish API (/apps/{id}/events etc.) is deliberately
    # NOT exposed here -- config/broadcasting.php's reverb connection talks
    # to it directly over REVERB_SERVER_HOST/PORT (127.0.0.1:8080, same
    # container) instead, so it never needs to be reachable externally.
    # The Upgrade/Connection headers are what turn this from a plain HTTP
    # proxy into a WebSocket one; without them the client's protocol
    # upgrade handshake fails. 8080 matches docker/supervisor/supervisord.conf's
    # [program:reverb] bind port.
    location /app {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    client_max_body_size 64M;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
